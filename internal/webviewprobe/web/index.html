<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aicat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar">
    <div class="window-space"></div>
    <span class="breadcrumb">流量 <span>›</span> 全部域名</span>
    <button id="recording" aria-label="暂停采集"><span class="dot"></span><span id="recording-label">正在录制</span></button>
    <button id="theme" aria-label="切换主题">☼</button>
  </header>
  <div class="shell">
    <nav class="rail" aria-label="导航">
      <button class="active" aria-label="流量"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9-6-18-3 9H2"/></svg></button>
      <span class="avatar">AC</span>
    </nav>
    <aside>
      <div class="side-search"><input id="domain-search" aria-label="查找域名" placeholder="查找域名…"></div>
      <button id="all-domains" class="domain-heading active"><span>⌄　域名</span><span id="domain-count">0</span></button>
      <div id="domains"></div>
      <div class="connection"><span class="dot"></span><span id="connection">正在连接…</span></div>
    </aside>
    <main>
      <div class="toolbar"><input id="search" aria-label="搜索 URL" placeholder="搜索 URL…"><kbd>⌘ K</kbd><button id="clear">清空</button></div>
      <section class="table-area">
        <div class="columns table-head"><span>#</span><span>URL</span><span>方法</span><span>状态</span><span>耗时</span><span>大小</span></div>
        <div id="rows-viewport" tabindex="0" role="grid" aria-label="流量列表">
          <div id="rows-space"><div id="rows"></div></div>
          <div id="list-empty">等待流量 · 请在客户端配置代理</div>
        </div>
      </section>
      <section id="details">
        <div id="detail-empty">未选择请求</div>
        <div id="detail-content" hidden>
          <div id="detail-title"></div>
          <div class="inspectors">
            <section class="inspector" data-side="request">
              <header><strong>请求</strong><button class="tab active" data-view="headers">Header</button><button class="tab" data-view="raw">Raw</button></header>
              <div class="body-notice"></div><div class="headers"></div><pre class="raw" hidden></pre>
            </section>
            <section class="inspector" data-side="response">
              <header><strong>响应</strong><button class="tab active" data-view="headers">Header</button><button class="tab" data-view="raw">Raw</button></header>
              <div class="body-notice"></div><div class="headers"></div><pre class="raw" hidden></pre>
            </section>
          </div>
        </div>
      </section>
      <footer><span id="count">0 个请求</span><span id="selection">已选择 0 项</span></footer>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
