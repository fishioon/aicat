      const error=main.querySelector('[data-listen-error]');error.hidden=valid;error.textContent=valid?'':t('invalidPort');
      if(!valid)return;
      state.listenPort=value;remember();
    }
    side.querySelector('.ac-proxy-sub')?.replaceChildren(document.createTextNode(state.listenAddress+':'+state.listenPort));
  }
  function renderSettings(){
    let content;
    if(state.setting==='general')content=settingRow('language','languageDesc',`<select class="ac-select" data-language aria-label="${t('language')}">${[['system',t('system')],['zh-CN','简体中文'],['en','English']].map(([id,label])=>`<option value="${id}" ${state.locale===id?'selected':''}>${label}</option>`).join('')}</select>`)+settingRow('theme','themeDesc',`<div class="ac-appearance">${[['system','system'],['light','light'],['dark','dark']].map(([id,key])=>`<button data-theme-choice="${id}" aria-pressed="${state.theme===id}" class="cursor-interaction">${t(key)}</button>`).join('')}</div>`);
    else if(state.setting==='proxy')content=settingRow('systemProxy','systemProxyDesc',`<span class="ac-badge">${t('enabled')}</span>`)+settingRow('listen','',listenerControl())+settingRow('ca','caDesc',`<span class="ac-badge">${t('trusted')}</span>`);
    else if(state.setting==='features')content=settingRow('traffic','featuresDesc',`<label><input type="checkbox" data-feature-traffic ${state.trafficEnabled!==false?'checked':''} aria-label="${t('enableTraffic')}"></label>`);
    else content=`<div style="padding:30px 0 20px;display:flex;align-items:center;gap:14px"><span style="color:var(--ac-brand-text)">${icon('cat')}</span><div><div style="font-size:21px">AICat</div><div class="ac-sub">${t('tagline')}</div></div></div><div class="ac-setting-row"><div class="ac-rule-title">${t('version')}</div><div class="ac-sub">${t('preview')}</div></div>`;
    main.innerHTML=header(t(state.setting))+`<nav class="ac-settings-nav" aria-label="${t('preferences')}">${['general','proxy','features'].map(key=>`<button class="cursor-interaction" data-setting="${key}" aria-current="${state.setting===key}">${t(key)}</button>`).join('')}</nav><div class="ac-content-pad ac-settings-content">${content}</div>`;
    main.dataset.pageTitle=t(state.setting);
  }
  function labelControl(selector,key){const el=root.querySelector(selector);el.setAttribute('aria-label',t(key));if(el.hasAttribute('data-tooltip'))el.dataset.tooltip=t(key);}
  function closeProfile(focus=false){profileMenu.hidden=true;profileButton.setAttribute('aria-expanded','false');if(focus)profileButton.focus();}
  function openSettings(){visit(()=>{state.module='settings';state.setting='general';state.mobileSidebar=false;});}
  function toggleProfile(){
    if(!profileMenu.hidden){closeProfile();return;}
    menu.hidden=true;
    profileMenu.innerHTML=`<div class="ac-profile-heading" role="presentation"><span class="ac-avatar" aria-hidden="true">AC</span><div><div class="ac-profile-name">AICat</div><div class="ac-profile-sub">${t('privateCloud')}</div></div></div><div class="ac-profile-note">${t('privateCloudLogin')}</div><button class="cursor-interaction" role="menuitem" data-action="open-settings">${icon('settings-2')}<span>${t('settings')}</span><span class="ac-profile-shortcut" aria-hidden="true">⌘,</span></button>`;
    profileMenu.setAttribute('aria-label',t('profileMenu'));profileMenu.hidden=false;profileButton.setAttribute('aria-expanded','true');icons();profileMenu.querySelector('button:not(:disabled)').focus();
  }
  function render(){
    normalize();menu.hidden=true;root.querySelector('.ac-toast').hidden=true;
    closeProfile();profileButton.dataset.active=String(state.module==='settings');
    const narrow=root.querySelector('.ac-stage').getBoundingClientRect().width<=560;
    root.classList.toggle('ac-mobile-sidebar',state.mobileSidebar);
    const sidebarButton=root.querySelector('[data-action="sidebar"]');
    sidebarButton.hidden=state.module==='home';
    sidebarButton.setAttribute('aria-expanded',String(!sidebarButton.hidden&&(narrow?state.mobileSidebar:state.sidebar)));
    root.lang=locale();root.dataset.theme=state.theme;root.setAttribute('aria-label',t('app'));
    root.classList.toggle('ac-no-sidebar',state.module==='home'||!state.sidebar);root.classList.toggle('ac-regions',design.regions);main.classList.toggle('ac-layout-right',design.layout==='right');root.classList.toggle('ac-settings-open',state.module==='settings');root.style.setProperty('--ac-row-height',design.density==='comfortable'?'36px':'30px');
    root.querySelectorAll('[data-module]').forEach(b=>{b.hidden=b.dataset.module==='traffic'&&state.trafficEnabled===false;b.setAttribute('aria-pressed',String(b.dataset.module===state.module));b.setAttribute('aria-label',t(b.dataset.module));b.dataset.tooltip=t(b.dataset.module);});
    root.querySelector('[data-module-name]').textContent=t(state.module);
    root.querySelector('[data-record-label]').textContent=t(state.recording?'recording':'resume');
    root.querySelector('[data-record-icon]').innerHTML=icon(state.recording?'pause':'play');
    root.querySelector('[data-record-dot]').style.background=state.recording?'var(--ac-brand)':'var(--ac-muted)';
    const recordButton=root.querySelector('[data-action="record"]');recordButton.setAttribute('aria-pressed',String(state.recording));recordButton.setAttribute('aria-label',t(state.recording?'recordAction':'resume'));recordButton.dataset.tooltip=t(state.recording?'pause':'resume');recordButton.hidden=state.module!=='traffic'||state.trafficEnabled===false;
    root.querySelectorAll('[data-traffic-action]').forEach(el=>{el.hidden=state.module!=='traffic'||state.trafficEnabled===false;});
    [['[data-action="back"]','back'],['[data-action="forward"]','forward'],['.ac-crumb','location'],['[data-action="sidebar"]','toggleSidebar'],['[data-action="export"]','export'],['[data-action="theme"]','themeToggle'],['.ac-rail','nav'],['.ac-sidebar','sidebar'],['.ac-main','main'],['[data-action="profile-menu"]','profileMenu']].forEach(([selector,key])=>labelControl(selector,key));
    root.querySelector('[data-action="back"]').dataset.tooltip=t('back')+' · ⌘[';
    root.querySelector('[data-action="forward"]').dataset.tooltip=t('forward')+' · ⌘]';
    renderSide();
    if(state.module==='home')renderHome();
    else if(state.module==='traffic')renderTraffic();
    else renderSettings();
    root.querySelector('[data-current-title]').textContent=main.dataset.pageTitle;updateHistoryButtons();icons();
  }
  function togglePin(host){
    const wasPinned=state.pinned.includes(host);
    state.pinned=wasPinned?state.pinned.filter(h=>h!==host):[...state.pinned,host];
    if(!wasPinned)state.pinsExpanded=true;
    if(wasPinned&&state.selectionSource==='pin'&&state.filter===host){state.selectionSource='domain';state.domainsExpanded=true;revealFilter();}
    render();remember();toast(t(wasPinned?'unpinnedToast':'pinnedToast'));
  }
  root.addEventListener('click',event=>{
    const requestRow=event.target.closest('tr[data-request]');
    if(requestRow&&!event.target.closest('button')){visit(()=>{state.selected=requestRow.dataset.request;});return;}
    const b=event.target.closest('button');if(!b)return;
    const gatewayForm=b.closest('[data-gateway-form]');
    if(gatewayForm&&b.type==='submit'){event.preventDefault();submitGatewayForm(gatewayForm);return;}
    if(b.dataset.action==='profile-menu'){toggleProfile();return;}
    closeProfile();
    menu.hidden=true;
    if(b.dataset.pin){togglePin(b.dataset.pin);return;}
    if(b.dataset.module==='traffic'&&state.trafficEnabled===false)return;
    if(b.dataset.module){visit(()=>{state.module=b.dataset.module;if(state.module==='home')state.gatewayPage='overview';});return;}
    if(b.dataset.inspectorView){changeInspector(b.dataset.inspectorSide,b.dataset.inspectorView);return;}
    if(b.dataset.treeHost){visit(()=>{
      const host=b.dataset.treeHost,path=b.dataset.treePath,key=branchKey(host,path),open=state.expandedNodes.includes(key);
      state.expandedNodes=open?state.expandedNodes.filter(value=>value!==key):[...state.expandedNodes,key];
      if(open&&state.filter===host&&state.pathFilter!==path&&withinPath(state.pathFilter,path))state.pathFilter=path;
    });return;}
    if(b.dataset.domain){visit(()=>{state.filter=b.dataset.domain;state.pathFilter='';state.selectionSource=b.dataset.source;state.query='';});return;}
    if(b.dataset.pathHost){visit(()=>{state.filter=b.dataset.pathHost;state.pathFilter=b.dataset.path;state.selectionSource=b.dataset.source;state.query='';});return;}
    if(b.dataset.setting){visit(()=>{state.setting=b.dataset.setting;});return;}
    if(b.dataset.select){visit(()=>{state.selected=b.dataset.select;});return;}
    if(b.dataset.themeChoice){state.theme=b.dataset.themeChoice;render();remember();return;}
    if(b.dataset.copyAddress){copyRaw(b.dataset.copyAddress);return;}
    if(b.dataset.gatewayPreview){
      showGatewayExample=b.dataset.gatewayPreview==='active';
      state.module='home';state.gatewayPage='overview';state.mobileSidebar=false;
      render();resetHistory();remember();return;
    }
    if(b.dataset.gatewayPage){visit(()=>{state.module='home';state.gatewayPage=b.dataset.gatewayPage;});main.querySelector('input')?.focus();return;}
    if(b.dataset.gatewayCapability){visit(()=>{state.module='home';state.gatewayPage='capability';state.gatewayCapability=b.dataset.gatewayCapability;});return;}
    if(b.dataset.gatewayActivity){visit(()=>{state.module='home';state.gatewayPage='activity';state.gatewayActivity=b.dataset.gatewayActivity;});return;}
    const action=b.dataset.action;
    if(action==='traffic-settings'){visit(()=>{state.module='settings';state.setting='features';state.mobileSidebar=false;});return;}
    if(action==='copy-url'||action==='copy-curl'){const r=fixtures.find(r=>r.id===b.dataset.requestId);if(r&&!(action==='copy-curl'&&r.encrypted))copyRaw(action==='copy-url'?requestURL(r):curlCommand(r));menuOrigin?.focus();return;}
    else if(action==='open-settings'){openSettings();return;}
    else if(action==='back'){travel(-1);return;}
    else if(action==='forward'){travel(1);return;}
    else if(action==='all-domains'){visit(()=>{state.filter='all';state.pathFilter='';state.query='';});return;}
    else if(action==='toggle-domains'){
      const change=()=>{state.domainsExpanded=!state.domainsExpanded;if(!state.domainsExpanded&&state.selectionSource==='domain'&&state.filter!=='all'){state.filter='all';state.pathFilter='';state.query='';}};
      if(state.domainsExpanded&&state.selectionSource==='domain'&&state.filter!=='all'){visit(change);return;}change();render();
    }
    else if(action==='toggle-pins'){
      const change=()=>{state.pinsExpanded=!state.pinsExpanded;if(!state.pinsExpanded&&state.selectionSource==='pin'&&state.filter!=='all'){state.filter='all';state.pathFilter='';state.query='';}};
      if(state.pinsExpanded&&state.selectionSource==='pin'&&state.filter!=='all'){visit(change);return;}change();render();
    }
    else if(action==='sidebar'){if(root.querySelector('.ac-stage').getBoundingClientRect().width<=560)state.mobileSidebar=!state.mobileSidebar;else state.sidebar=!state.sidebar;render();}
    else if(action==='theme'){const dark=state.theme==='dark'||(state.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);state.theme=dark?'light':'dark';render();}
    else if(action==='record'){state.recording=!state.recording;render();}
    else if(action==='clear'){fixtures.splice(0);state.selected=null;state.query='';state.filter='all';state.pathFilter='';state.selectionSource='domain';render();}
    else if(action==='decrypt-domain'){const r=fixtures.find(r=>r.id===state.selected);if(r&&!state.decryptDomains.includes(r.host))state.decryptDomains.push(r.host);renderDetail();}
    else if(action==='copy-inspector'){const r=fixtures.find(r=>r.id===state.selected),side=b.dataset.copySide;if(r)copyRaw(inspectorViews[side]==='header'?headerPairs(r,side).map(([key,value])=>key+': '+value).join('\n'):rawMessage(r,side),b);}
    else if(action==='copy'){const p=b.closest('.ac-payload')?.querySelector('pre');if(p){const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(p);selection.removeAllRanges();selection.addRange(range);}toast(t('copySelected'));}
    else if(action==='replay'){const original=fixtures.find(r=>r.id===state.selected)||fixtures[0],next={...original,id:'replay-'+Date.now(),time:original.time+12};fixtures.unshift(next);visit(()=>{state.selected=next.id;state.filter='all';state.query='';});toast(t('replayed'));return;}
    else if(action==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(visibleRequests(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='aicat-traffic.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(t('exported'));}
    remember();
  });
  function submitGatewayForm(form){
    if(!form.reportValidity())return;
    const values=new FormData(form);
    if(form.dataset.gatewayForm==='provider'){
      const address=String(values.get('address')).trim();
      const endpoint=new URL(address);
      addedProviders.push({name:endpoint.hostname,address,models:['fast-chat','reasoning']});
      visit(()=>{state.gatewayPage='capability';state.gatewayCapability='models';});
      toast(gatewayText('已添加上游，模型列表为演示数据','Provider added with sample model data'));
    }else if(form.dataset.gatewayForm==='agent'){
      const name=String(values.get('agent')).trim();
      if(!name){form.elements.agent.setCustomValidity(gatewayText('请填写 Agent 名称','Enter an agent name'));form.reportValidity();return;}
      addedAgents.push(name);
      visit(()=>{state.gatewayPage='overview';});
      toast(gatewayText('接入配置已保存，等待首次请求（演示）','Connection saved; awaiting the first request (demo)'));
    }
  }
  root.addEventListener('submit',event=>{
    const form=event.target.closest('[data-gateway-form]');
    if(form){event.preventDefault();submitGatewayForm(form);}
  });
  root.addEventListener('change',event=>{if(event.target.matches('[data-feature-traffic]')){state.trafficEnabled=event.target.checked;render();remember();}});
  root.addEventListener('contextmenu',event=>{
    const requestRow=event.target.closest('[data-request]'),row=event.target.closest('[data-domain-row]');if(!row&&!requestRow)return;event.preventDefault();
    closeProfile();
    if(requestRow){
      const id=requestRow.dataset.request,r=fixtures.find(r=>r.id===id);if(!r)return;
      if(state.selected!==id)visit(()=>{state.selected=id;});
      menuOrigin=main.querySelector(`[data-select="${id}"]`);
      menu.innerHTML=`<button class="cursor-interaction" role="menuitem" data-action="copy-url" data-request-id="${id}">${t('copyURL')}</button><button class="cursor-interaction" role="menuitem" data-action="copy-curl" data-request-id="${id}" ${r.encrypted?`disabled data-tooltip="${t('curlUnavailable')}"`:''}>${t('copyCurl')}</button>`;
      menu.innerHTML+=`<div role="separator"></div><button class="cursor-interaction" role="menuitem" data-pin="${esc(r.host)}">${t(state.pinned.includes(r.host)?'unpin':'pin')}</button>`;
      menu.setAttribute('aria-label',t('requestActions'));
    }else{
      const host=row.dataset.domainRow,pinned=state.pinned.includes(host);
      menuOrigin=row.querySelector('[data-domain]');
      menu.innerHTML=`<button class="cursor-interaction" role="menuitem" data-pin="${esc(host)}">${icon(pinned?'pin-off':'pin')}<span>${t(pinned?'unpin':'pin')}</span></button>`;
      menu.setAttribute('aria-label',host);
    }
    menu.hidden=false;icons();
    const bounds=root.querySelector('.ac-window').getBoundingClientRect();
    menu.style.left=Math.max(4,Math.min(event.clientX-bounds.left,bounds.width-menu.offsetWidth-5))+'px';menu.style.top=Math.max(4,Math.min(event.clientY-bounds.top,bounds.height-menu.offsetHeight-5))+'px';menu.querySelector('button').focus();
  });
  document.addEventListener('click',event=>{if(!event.target.closest('.ac-context-menu'))menu.hidden=true;if(!event.target.closest('.ac-profile-menu,[data-action="profile-menu"]'))closeProfile();});
  root.addEventListener('input',event=>{
    if(event.target.matches('[name="agent"]'))event.target.setCustomValidity('');
    if(event.target.matches('[data-query]')){state.query=event.target.value;renderRows();remember();}
    if(event.target.matches('[data-side-search]')){state.sideQuery=event.target.value;filterSide();remember();}
  });
  root.addEventListener('change',changeListener);
  root.addEventListener('change',event=>{if(event.target.matches('[data-language]')){state.locale=event.target.value;render();remember();main.querySelector('[data-language]')?.focus();}});
  root.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&event.target.matches('[data-gateway-form] input')){event.preventDefault();submitGatewayForm(event.target.closest('form'));return;}
    if(!menu.hidden&&event.target.closest('.ac-context-menu')&&['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();const buttons=[...menu.querySelectorAll('button:not(:disabled)')],current=buttons.indexOf(document.activeElement),next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(current+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[next]?.focus();return;}
    if(event.target.matches('[data-inspector-view]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const view=event.key==='Home'?'header':event.key==='End'?'raw':event.target.dataset.inspectorView==='header'?'raw':'header',side=event.target.dataset.inspectorSide;changeInspector(side,view);main.querySelector(`#ac-${side}-${view}-tab`).focus();return;}
    if(event.key==='Escape'&&!profileMenu.hidden){event.preventDefault();closeProfile(true);return;}
    if(event.target.closest('[data-action="profile-menu"]')&&['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();if(profileMenu.hidden)toggleProfile();else profileMenu.querySelector('button:not(:disabled)').focus();return;}
    if(event.target.closest('.ac-profile-menu')&&['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();profileMenu.querySelector('button:not(:disabled)').focus();return;}
    if((event.metaKey||event.ctrlKey)&&!event.altKey&&event.key===','){event.preventDefault();openSettings();return;}
    if((event.metaKey||event.ctrlKey)&&!event.altKey&&!event.shiftKey&&['[',']'].includes(event.key)){
      if(event.target.closest('input,textarea,select,[contenteditable="true"]'))return;
      event.preventDefault();travel(event.key==='['?-1:1);return;
    }
    if(event.key==='Escape'&&!menu.hidden){event.preventDefault();menu.hidden=true;menuOrigin?.focus();return;}
    else if(event.key==='Escape'&&state.module==='traffic'&&!event.target.closest('input,textarea,select')){state.selected=null;renderRows();renderDetail();remember();}
    if((event.key==='F10'&&event.shiftKey||event.key==='ContextMenu')&&event.target.closest('[data-domain-row],[data-request]')){event.preventDefault();const rect=event.target.getBoundingClientRect();event.target.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:rect.left+10,clientY:rect.bottom}));}
    if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();(main.querySelector('[data-query]')||side.querySelector('input')||main.querySelector('select'))?.focus();}
  });
  window.addEventListener('languagechange',()=>{if(state.locale==='system')render();});
  window.addEventListener('openai:set_globals',event=>{
    const next=event.detail?.globals?.widgetState?.privateContent;
    if(!next||typeof next!=='object')return;
    const signature=stateSignature(next);
    if(signature===stateSignature(state)||localSnapshots.has(signature))return;
    const previous=JSON.stringify(viewSnapshot());
    Object.assign(state,defaults,next);render();
    if(JSON.stringify(viewSnapshot())!==previous)resetHistory();
  });
  render();resetHistory();
  let narrowViewport=root.querySelector('.ac-stage').getBoundingClientRect().width<=560;
  const shellResize=new ResizeObserver(()=>{const next=root.querySelector('.ac-stage').getBoundingClientRect().width<=560;if(next!==narrowViewport){narrowViewport=next;state.mobileSidebar=false;render();}});
  shellResize.observe(root.querySelector('.ac-stage'));
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:()=>{render();remember();}});
    tweak.addSelect(design,'density',{label:'列表密度',options:[{label:'紧凑',value:'compact'},{label:'宽松',value:'comfortable'}]});
    tweak.addToggle(design,'regions',{label:'标注布局区域'});
  }
})();
</script>
