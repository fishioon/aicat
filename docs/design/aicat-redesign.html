<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aicat 重新设计稿</title>
<!--
  aicat 外壳重新设计稿（2026-11-11）。可独立打开：不依赖宿主、图标库或网络。
  覆盖：概览（已接入 / 首次接入 / 接入 Agent）、流量、扩展、设置（通用 / 代理），明暗两套。
  数据全部为演示数据。界面文案只做了简体中文。

  骨架：标题栏（前进后退、面包屑、监听地址、主题）+ 左侧图标导航栏 + 各模块自己的侧栏 + 主区。
  色板沿用公司设定：品牌青 #00bba7（与 netcat 网站和 assets/logo.svg 一致）、中性灰底色，
  取值对应 ui/src/design.css 的 --ac-* 变量；--ink-2、--line-strong、--warn-soft 是在同一灰阶上补的。

  设计规则
  1. 品牌青只表示三件事：aicat 自己、你现在的位置、这一屏的主操作。状态一律用 ok / warn / bad。
     浅色下细线标记和焦点环用 --mark-line（对白底 3:1 以上），大面积填充用 --mark。
     品牌青和成功绿在浅色下很接近，所以靠形态区分：品牌色只以线条和填充出现，
     状态只以“圆点 + 文字”出现，品牌色不做圆点。
  2. 正常是安静的。2xx、已连接、已信任的文字都用正文色，只有需要看的才上色。
     请求列表行首的状态点是例外：成功也给绿点，方便一眼扫过整列。
  3. 数字和地址用 --num（DIN Alternate），代码用 --code，其余用 --ui。
  4. 字号 11 / 12 / 13 / 15 / 20 / 28；圆角 4 / 8 / 12；间距取 4 的倍数；主区左边线统一为 --gutter。
-->
<style>
:root{
  color-scheme:light;
  --desk:#E6E6EA; --chrome:#F6F6F7; --surface:#FFFFFF; --sunken:#F2F2F5;
  --ink:#242428; --ink-2:#4B4B53; --ink-3:#66666F;
  --line:#E1E1E5; --line-strong:#85858F; --hover:#E9E9ED;
  --mark:#00BBA7; --mark-line:#077A6F; --mark-soft:#E5F5F1; --on-mark:#111827;
  --logo:#16325C; --logo-bg:#F5F2ED; --float:#2B2B30;
  --ok:#18794E; --warn:#926117; --bad:#B42318; --warn-soft:#FBF1DF; --bad-soft:#FFF0EE;
  --syn-key:#375BB5; --syn-str:#7B3FB0; --syn-num:#926117;
  --s1:#2A78D6; --s2:#EB6834; --s3:#6250D6;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --num:"DIN Alternate","Bahnschrift","Roboto Condensed",-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
  --code:"SF Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono",monospace;
  --t11:11px; --t12:12px; --t13:13px; --t15:15px; --t20:20px; --t28:28px;
  --r1:4px; --r2:8px; --r3:12px;
  --gutter:16px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#121214; --chrome:#252527; --surface:#202022; --sunken:#272729;
  --ink:#E9E9ED; --ink-2:#C4C4CC; --ink-3:#A6A6B0;
  --line:#37373B; --line-strong:#7C7C86; --hover:#303033;
  --mark:#00BBA7; --mark-line:#00BBA7; --mark-soft:#123B38; --on-mark:#111827;
  --logo:#16325C; --logo-bg:#F5F2ED; --float:#303033;
  --ok:#79CBA5; --warn:#F2BD5C; --bad:#FF8A7A; --warn-soft:#33280F; --bad-soft:#2C1918;
  --syn-key:#9EB9EF; --syn-str:#C8A6F5; --syn-num:#F2BD5C;
  --s1:#3987E5; --s2:#D95926; --s3:#9085E9;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:var(--t13)/1.5 var(--ui);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mark-line);outline-offset:2px;border-radius:var(--r1)}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
code,.code{font-family:var(--code);font-size:var(--t12)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* 预览条：不属于产品界面 */
.preview{width:100%;max-width:1240px;display:flex;align-items:center;gap:12px;padding:0 4px 12px;color:var(--ink-2);font-size:var(--t12)}
.preview strong{color:var(--ink);font-weight:600}
.preview .grow{flex:1}

/* 控件 */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r2);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--mark);border-color:var(--mark-line);color:var(--on-mark);font-weight:600}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:28px;height:28px;border:0;border-radius:var(--r2);background:none;color:var(--ink-2)}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.link:hover{text-decoration-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r2);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:26px;padding:0 12px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.seg button:focus-visible{outline-offset:-3px}
.seg button[aria-pressed="true"]:focus-visible,.seg button[aria-checked="true"]:focus-visible{outline-color:var(--surface)}
.field{height:28px;padding:0 8px;border:1px solid var(--line-strong);border-radius:var(--r2);background:var(--surface);min-width:0}
.field::placeholder{color:var(--ink-3)}
.switch{position:relative;width:36px;height:20px;flex:none;border:1px solid var(--line-strong);border-radius:10px;background:var(--sunken);padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--surface)}
.switch:disabled{opacity:.5;cursor:not-allowed}
.state{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.state.ok{color:var(--ink-2)} .state.ok::before{background:var(--ok)}
.state.warn{color:var(--warn)} .state.bad{color:var(--bad)}
.state.idle{color:var(--ink-3)} .state.idle::before{background:none;border:1.5px solid currentColor}
.copyline{display:flex;align-items:center;gap:4px;min-width:0;border:1px solid var(--line);border-radius:var(--r2);background:var(--sunken);padding:0 4px 0 12px;min-height:36px}
.copyline code{flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 0;user-select:all}

/* 窗口 */
.win{width:100%;max-width:1240px;flex:1;min-height:0;max-height:820px;display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:44px minmax(0,1fr);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r3);overflow:hidden;box-shadow:0 24px 48px -24px rgba(21,25,39,.3);position:relative}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:var(--chrome);border-bottom:1px solid var(--line);min-width:0}
.lights{display:flex;gap:8px;flex:none} .lights i{width:12px;height:12px;border-radius:50%;background:var(--line-strong);opacity:.55}
.hist{display:flex;gap:2px;flex:none;margin-left:4px}
.icon-btn:disabled{opacity:.4;cursor:default;background:none;color:var(--ink-2)}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;font-size:var(--t13);color:var(--ink-2);white-space:nowrap;overflow:hidden}
.crumb svg{width:12px;height:12px;color:var(--ink-3)}
.crumb span{overflow:hidden;text-overflow:ellipsis}
.crumb span:first-child{flex:none}
.crumb span:last-child{color:var(--ink);font-weight:600}
.bar .grow{flex:1}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;background:var(--chrome);border-right:1px solid var(--line);min-height:0}
.rail button{position:relative;display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:var(--r2);background:none;color:var(--ink-3)}
.rail button svg{width:20px;height:20px}
.rail button:hover{background:var(--hover);color:var(--ink)}
.rail button[aria-current="page"],.rail button[aria-expanded="true"]{background:var(--mark-soft);color:var(--mark-line)}
.rail .grow{flex:1}
.addr{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);font-size:var(--t13);flex:none}
.addr:hover{border-color:var(--line-strong)}
.addr .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.addr svg{color:var(--ink-3)}
.page{min-height:0;min-width:0;overflow:hidden}
.split{display:grid;grid-template-columns:224px minmax(0,1fr);height:100%}
.side{background:var(--chrome);border-right:1px solid var(--line);overflow:auto;padding:12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0}
.main{min-width:0;min-height:0;overflow:auto}
.side .search{flex:none}
.side-title{padding:12px 8px 4px;font-size:var(--t12);color:var(--ink-3);display:flex;justify-content:space-between}
.side-item{position:relative;display:flex;align-items:center;gap:6px;width:100%;min-height:28px;padding:2px 8px;border:0;border-radius:var(--r1);background:none;text-align:left}
.side-item:hover{background:var(--sunken)}
.side-item[aria-current="true"]{background:var(--mark-soft);font-weight:600}
.side-item[aria-current="true"]::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--mark-line)}
.side-item .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item .count{color:var(--ink-3);font-size:var(--t12);font-weight:400}
.side-item[aria-current="true"] .count{color:var(--ink-2)}
.side-item small{display:block;color:var(--ink-2);font-size:var(--t12);font-weight:400}
.side-foot{margin-top:auto;padding:12px 8px 4px;color:var(--ink-3);font-size:var(--t12)}
.trow{display:flex;align-items:center;gap:2px}
.trow .side-item{flex:1;min-width:0}
.twist{display:inline-grid;place-items:center;width:16px;height:16px;border:0;background:none;padding:0;color:var(--ink-3);flex:none}
.twist svg{width:12px;height:12px;transition:transform .12s}
.twist[aria-expanded="true"] svg{transform:rotate(90deg)}
.twist.none{visibility:hidden}

/* 概览 */
.ov{max-width:1080px;margin:0 auto;padding:32px}
.ov-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px}
.ov-head h1{font-size:var(--t20);font-weight:600;line-height:1.3}
.ov-head p{color:var(--ink-2);margin-top:4px}
.ov-head .grow{flex:1}
.ov-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card{border:1px solid var(--line);border-radius:var(--r3);background:var(--surface)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{min-width:0;padding:12px 16px}
.tile+.tile{border-left:1px solid var(--line)}
.tile h2{font-size:var(--t12);font-weight:400;color:var(--ink-2)}
.tile .v{font-size:var(--t20);font-weight:600;line-height:1.5;white-space:nowrap}
.tile .v small{margin-left:4px;font:400 var(--t12) var(--ui);color:var(--ink-2)}
.tile .s{font-size:var(--t12);color:var(--ink-2)}
.tile .s b{font-weight:600;color:var(--bad)}
.meter{height:4px;margin-top:8px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:2px;background:var(--ink-2)}
.usage{margin-top:12px}
.usage-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.usage-head .grow{flex:1}
.usage-head .lbl{font-size:var(--t12);color:var(--ink-3)}
.usage-body{display:grid;grid-template-columns:minmax(0,1fr) 248px}
.chart{display:grid;grid-template-columns:48px minmax(0,1fr);grid-template-rows:200px 20px;padding:20px 16px 8px 4px}
.yaxis{position:relative;font-size:var(--t11);color:var(--ink-3)}
.yaxis span{position:absolute;right:8px;transform:translateY(50%);white-space:nowrap}
.plot{position:relative}
.plot .grid{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.cols{position:absolute;inset:0;display:flex}
.col{flex:1;min-width:0;display:flex;justify-content:center;border-radius:var(--r1) var(--r1) 0 0}
.col:hover,.col:focus-visible{background:var(--sunken)}
.col:focus-visible{outline-offset:-2px}
.stack{display:flex;flex-direction:column-reverse;gap:2px;width:min(24px,64%);height:100%}
.stack i{display:block;flex:none;min-height:1px}
.stack i:last-child{border-radius:var(--r1) var(--r1) 0 0}
.xaxis{display:flex;align-items:flex-end;font-size:var(--t11);color:var(--ink-3)}
.xaxis span{flex:1;min-width:0;text-align:center;white-space:nowrap}
.tip{position:absolute;top:0;z-index:2;display:grid;gap:2px;min-width:168px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--r2);background:var(--surface);box-shadow:0 8px 24px -12px rgba(0,0,0,.4);font-size:var(--t12);pointer-events:none}
.tip[hidden]{display:none}
.tip strong{font-weight:600}
.tip div{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;color:var(--ink-2)}
.tip div i,.legend li>i{width:8px;height:8px;border-radius:2px}
.tip div b{font-weight:600;color:var(--ink)}
.tip .sum{margin-top:2px;padding-top:4px;border-top:1px solid var(--line)}
.legend{display:grid;gap:12px;align-content:start;padding:16px;border-left:1px solid var(--line)}
.legend li{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:0 8px;align-items:center}
.legend .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-weight:600}
.legend .sub{grid-column:2/-1;font-size:var(--t12);color:var(--ink-2)}
.start{padding:0 20px 20px}
.conn li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.conn li>div{flex:1;min-width:0}
.conn strong{display:block;font-weight:600}
.conn .who{display:block;font-size:var(--t12);color:var(--ink-2)}
.conn .bad{color:var(--bad);font-weight:600} .conn .warn{color:var(--warn)}
.form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;max-width:520px;margin:12px 0}
.form label{font-size:var(--t12);color:var(--ink-2)}
.ov-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;margin-top:32px}
.ov-cols h2{font-size:var(--t15);font-weight:600}
.ov-cols .sub{color:var(--ink-3);font-size:var(--t12);margin-bottom:8px}
.endpoints{display:grid;gap:8px}
.endpoints label{display:block;color:var(--ink-2);font-size:var(--t12);margin-bottom:4px}
/* 接入 Agent */
.back{margin-bottom:16px}
.steps{display:grid;gap:24px;margin-top:24px;max-width:720px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.step .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:var(--t13);color:var(--ink-2)}
.step.now .n{background:var(--mark);border-color:var(--mark);color:var(--on-mark);font-weight:700}
.step.done .n{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.step h2{font-size:var(--t15);font-weight:600;line-height:28px}
.step p{color:var(--ink-2);margin-bottom:12px;max-width:60ch}
.snippet{border:1px solid var(--line);border-radius:var(--r2);background:var(--sunken);margin:12px 0;overflow:hidden}
.snippet header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);font-size:var(--t12)}
.snippet pre{margin:0;padding:12px;font:var(--t12)/1.6 var(--code);white-space:pre-wrap;overflow-wrap:anywhere}
.waiting{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--ink);animation:spin .9s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* 流量 */
.tr{display:grid;grid-template-rows:auto minmax(120px,1fr) auto auto;height:100%;min-height:0}
.tr.open{grid-template-rows:auto minmax(120px,5fr) minmax(0,6fr) auto}
.tools{display:flex;align-items:center;gap:8px;padding:8px var(--gutter);border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{position:relative;flex:1;min-width:180px;display:flex}
.search svg{position:absolute;left:8px;top:6px;color:var(--ink-3)}
.search input{flex:1;padding-left:30px;padding-right:44px}
.search kbd{position:absolute;right:8px;top:5px;font:var(--t11) var(--ui);color:var(--ink-3);border:1px solid var(--line);border-radius:var(--r1);padding:0 4px;line-height:16px}
.listwrap{overflow:auto;min-height:0}
table.list{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--t12)}
.list th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;font-weight:400;color:var(--ink-3);height:28px;padding:0 8px;border-bottom:1px solid var(--line)}
.list td{height:28px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.list th:first-child,.list td:first-child{padding-left:var(--gutter)}
.list th:last-child,.list td:last-child{padding-right:var(--gutter)}
.list .r{text-align:right}
.list tbody tr{cursor:default}
.list tbody tr:nth-child(even){background:var(--sunken)}
.list tbody tr:hover{background:var(--hover)}
.list tbody tr[aria-selected="true"]{background:var(--mark-soft);box-shadow:inset 3px 0 0 var(--mark-line)}
.list tbody tr:focus-visible{outline-offset:-2px}
.list .dim{color:var(--ink-3)} .list .path{color:var(--ink-2)}
.list tbody tr[aria-selected="true"] .dim{color:var(--ink-2)}
.st-bad{color:var(--bad);font-weight:700}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.sd.ok{background:var(--ok)} .sd.bad{background:var(--bad)} .sd.mute{background:var(--ink-3)}
.sd.ring{border:1.5px solid var(--ink-3)}
.sd-run{width:10px;height:10px;vertical-align:middle}
.list td.dotc{padding-right:0;text-overflow:clip}
.list th:nth-child(2),.list td:nth-child(2){padding-left:0}
.sum .st{display:inline-flex;align-items:center;gap:6px;align-self:center}
.empty{display:grid;place-content:center;justify-items:start;gap:12px;height:100%;padding:32px var(--gutter);max-width:560px;margin:0 auto}
.empty h2{font-size:var(--t20);font-weight:600}
.empty p{color:var(--ink-2)}
.empty .copyline{width:100%}
.insp{display:grid;grid-template-rows:auto minmax(0,1fr);border-top:1px solid var(--line-strong);min-height:0}
.sum{display:flex;align-items:baseline;gap:12px;padding:8px var(--gutter);border-bottom:1px solid var(--line);min-width:0}
.sum .m{font-weight:700}
.sum .url{flex:1;min-width:0;font:var(--t12)/1.5 var(--code);overflow-wrap:anywhere;max-height:3em;overflow:auto;user-select:text}
.sum .meta{color:var(--ink-2);font-size:var(--t12);white-space:nowrap}
.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.pane{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}

const rnd=(a,b)=>{const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x);};

const SLOT={'claude-sonnet-4-5':1,'gpt-5-codex':2,'claude-haiku-4-5':3,Anthropic:1,OpenAI:2,'Claude Code':1,Codex:2};
const HOURS=[.9,.7,.1,0,0,0,0,.15,.2,.3,.55,.7,.6,.8,.2,.12,.1,.14,.08];

const FMT={token:big,cost:v=>'$'+(v>=100?v.toFixed(0):v.toFixed(2)),req:big};
function usage(range,dim,metric){
  const R=RANGES[range],keyOf=c=>dim==='model'?c.model:dim==='prov'?c.prov:c.agent,map=new Map();
  USE.forEach((c,ci)=>{
    const k=keyOf(c);
    if(!map.has(k))map.set(k,{name:k,slot:SLOT[k],v:Array(R.n).fill(0)});
    for(let i=0;i<R.n;i++){
      const tk=R.scale*R.shape(i)*c.w*(.8+.4*rnd(i+1,ci+1));
      map.get(k).v[i]+=metric==='token'?tk:metric==='cost'?tk/1e6*c.price:tk/c.tok;
    }
  });
  const series=[...map.values()].sort((a,b)=>a.slot-b.slot);
  series.forEach(s=>s.total=s.v.reduce((a,b)=>a+b,0));
  const tot=Array.from({length:R.n},(_,i)=>series.reduce((a,s)=>a+s.v[i],0));
  return {R,series,tot,sum:tot.reduce((a,b)=>a+b,0)};
}
const niceStep=x=>{const p=10**Math.floor(Math.log10(x)),f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;};

const fuzzy=(text,q)=>q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>{let i=0;for(const ch of text.toLowerCase()){if(ch===w[i])i++;if(i===w.length)return true;}return false;});
const hit=(r,f)=>!f||((!f.host||r.host===f.host)&&(!f.app||r.app===f.app)&&(f.path==null||r.path===f.path));
const visible=()=>R.filter(r=>hit(r,S.filter)&&(S.quick==='all'||(S.quick==='bad'?isBad(r):r.st==='pending'))&&(!S.q||fuzzy(url(r),S.q)));
const fkey=f=>f?[f.app||'',f.host||'',f.path==null?'':f.path].join('|'):'';
function trafficShell(){
  return `<div class="split"><aside class="side" id="tside" aria-label="筛选"></aside>
  <section class="main" style="overflow:hidden"><div class="tr" id="tr">
    <div class="tools">
      <label class="search"><span class="sr">搜索 URL</span>${icon('search')}<input class="field" id="q" data-in="q" placeholder="搜索 URL" value="${esc(S.q)}" autocomplete="off" spellcheck="false"><kbd>⌘K</kbd></label>
      ${seg('quick',S.quick,[['all','全部'],['bad','出错'],['run','进行中']],'按状态筛选')}
      <button type="button" class="btn" data-act="pause">${icon(S.paused?'play':'pause')}${S.paused?'继续采集':'暂停采集'}</button>
      <button type="button" class="btn" data-act="clear">清空</button>
      <button type="button" class="icon-btn" data-act="export" aria-label="导出为 JSON" title="导出为 JSON">${icon('down')}</button>
    </div>
    <div class="listwrap" id="list"></div><div id="insp"></div><div class="foot" id="foot"></div>
  </div></section></div>`;
}
function tree(){
  const uniq=a=>[...new Set(a)],cnt=f=>R.filter(r=>hit(r,f)).length;
  const hostNode=(h,app,pre)=>({id:pre+h,label:h,f:app?{app,host:h}:{host:h},host:h,
    kids:uniq(R.filter(r=>r.host===h&&r.path&&(!app||r.app===app)).map(r=>r.path)).map(p=>({id:pre+h+p,label:p,f:app?{app,host:h,path:p}:{host:h,path:p}}))});
  return [
    ['固定',S.pinned.map(h=>hostNode(h,null,'pin:'))],
    ['域名',uniq(R.map(r=>r.host)).map(h=>hostNode(h,null,'host:'))],
    ['应用',uniq(R.map(r=>r.app)).map(a=>({id:'app:'+a,label:a,f:{app:a},kids:uniq(R.filter(r=>r.app===a).map(r=>r.host)).map(h=>hostNode(h,a,'app:'+a+':'))}))]
  ].map(([t,nodes])=>[t,nodes,cnt]);
}
function drawSide(){
  const sq=S.sq.trim().toLowerCase();
  const match=n=>!sq||n.label.toLowerCase().includes(sq)||(n.kids||[]).some(match);
  const node=(n,d,cnt)=>{
    if(!match(n))return '';
    const kids=n.kids&&n.kids.length,open=kids&&(S.open.has(n.id)||!!sq),cur=fkey(n.f)===fkey(S.filter)&&!!S.filter;
    return `<li><div class="trow" style="padding-left:${d*14}px">
      ${kids?`<button type="button" class="twist" data-act="twist" data-v="${esc(n.id)}" aria-expanded="${!!open}" aria-label="${open?'收起':'展开'} ${esc(n.label)}">${icon('chev')}</button>`:'<span class="twist none"></span>'}
      <button type="button" class="side-item" data-act="filter" data-v="${esc(JSON.stringify(n.f))}" ${n.host?`data-host="${esc(n.host)}"`:''} ${cur?'aria-current="true"':''} title="${esc(n.label)}"><span class="label">${esc(n.label)}</span><span class="count num">${cnt(n.f)}</span></button>
    </div>${open?`<ul>${n.kids.map(k=>node(k,d+1,cnt)).join('')}</ul>`:''}</li>`;
  };
  $('#tside').innerHTML=`<label class="search" style="margin-bottom:4px"><span class="sr">查找应用或域名</span>${icon('search')}<input class="field" data-in="sq" placeholder="查找应用或域名" value="${esc(S.sq)}" autocomplete="off" spellcheck="false" style="padding-right:8px"></label>
    <button type="button" class="side-item" data-act="filter" data-v="null" ${S.filter?'':'aria-current="true"'}><span class="label">全部请求</span><span class="count num">${R.length}</span></button>
    ${tree().map(([t,nodes,cnt])=>`<div class="side-title"><span>${t}</span><span class="num">${nodes.length}</span></div><ul>${nodes.map(n=>node(n,0,cnt)).join('')}</ul>`).join('')}
    <div class="side-foot">在域名上点右键可以固定</div>`;
}
// 行首的状态点（参考 Proxyman、Rockxy）：绿 = 2xx，红 = 4xx / 5xx / 失败，灰 = 3xx，空心 = 未解密的隧道，转圈 = 进行中。
function stDot(r){
  if(r.st==='pending')return '<i class="spin sd-run"></i>';
  return `<i class="sd ${r.st==='tunnel'?'ring':isBad(r)?'bad':r.st>=300?'mute':'ok'}"></i>`;
}
function stCell(r){
  if(r.st==='tunnel')return '<span class="dim">隧道</span>';
  if(r.st==='pending')return '<span class="dim">进行中</span>';
  if(r.st==='failed')return '<span class="st-bad">失败</span>';
  return `<span class="num ${r.st>=400?'st-bad':r.st>=300?'dim':''}">${r.st}</span>`;
}
function drawList(focus){
  const box=$('#list'),top=box.scrollTop,rows=visible();
  if(S.sel!=null&&!rows.some(r=>r.id===S.sel))S.sel=null;
  if(!R.length)box.innerHTML=`<div class="empty"><h2>${S.paused?'采集已暂停':'还没有请求经过网关'}</h2>
    <p>${S.paused?'代理仍在转发请求，只是不再记录。':'让客户端使用 aicat 的代理地址，请求就会出现在这里。可以先用下面这条命令试一下。'}</p>
    ${S.paused?`<button type="button" class="btn primary" data-act="pause">${icon('play')}继续采集</button>`:copyline(`curl --proxy ${base()} https://example.com`,'命令')+`<button type="button" class="link" data-act="connect">接入 Agent</button>`}</div>`;
  else if(!rows.length)box.innerHTML=`<div class="empty"><h2>没有符合条件的请求</h2><p>共 ${R.length} 个请求，都被当前的搜索或筛选排除了。</p><button type="button" class="btn" data-act="reset">清除筛选</button></div>`;
  else box.innerHTML=`<table class="list"><colgroup><col style="width:32px"><col style="width:48px"><col><col class="opt" style="width:104px"><col style="width:84px"><col style="width:64px"><col class="opt" style="width:56px"><col class="opt" style="width:72px"><col class="opt" style="width:84px"></colgroup>
    <thead><tr><th><span class="sr">结果</span></th><th>#</th><th>URL</th><th class="opt">应用</th><th>方法</th><th>状态</th><th class="opt">类型</th><th class="opt r">耗时</th><th class="opt r">大小</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr data-id="${r.id}" tabindex="${(S.sel==null?i===0:r.id===S.sel)?0:-1}" aria-selected="${r.id===S.sel}" title="${esc(url(r))}">
      <td class="dotc" aria-hidden="true">${stDot(r)}</td><td class="num dim">${r.id}</td>
      <td>${esc(r.host)}<span class="path">${esc(r.path+(r.query?'?'+r.query:''))}</span></td>
      <td class="opt">${esc(r.app)}</td><td>${r.m}</td><td>${stCell(r)}</td>
      <td class="opt dim">${r.type}</td><td class="opt r num">${dur(r.ms)}</td><td class="opt r num">${r.size}</td></tr>`).join('')}</tbody></table>`;
  box.scrollTop=top;
  $('#tr').classList.toggle('open',S.sel!=null);
  $('#foot').innerHTML=`<span class="state ${S.paused?'idle':'ok'}">${S.paused?'已暂停，代理继续转发':'正在采集'}</span>
    <span><span class="num">${R.length}</span> 个请求${rows.length!==R.length?`，显示 <span class="num">${rows.length}</span> 个`:''}</span>
    <span class="grow"></span><span>${S.sel!=null?'Esc 取消选择':rows.length?'↑ ↓ 选择请求':''}</span>`;
  if(focus){const el=box.querySelector('tr[tabindex="0"]');if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'nearest'});}}
}
function hl(o){
  const s=JSON.stringify(o,null,2),re=/("(?:[^"\\]|\\.)*")(\s*:)?|-?\b\d+(?:\.\d+)?\b|\b(?:true|false|null)\b/g;
  let out='',last=0,m;
  while((m=re.exec(s))){out+=esc(s.slice(last,m.index))+(m[1]?`<span class="${m[2]?'k':'s'}">${esc(m[1])}</span>${m[2]||''}`:`<span class="n">${m[0]}</span>`);last=re.lastIndex;}
  return out+esc(s.slice(last));
}
const kv=rows=>rows.length?`<table class="kv"><tbody>${rows.map(([k,v])=>`<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`:'';
function tabsOf(r,side){
  const t=[['header','Header']];
  if(side==='req'){if(r.query)t.push(['query','Query']);if(r.req)t.push(['body','Body']);}
  else{if(r.res||r.text)t.push(['body','Body']);if(r.events)t.push(['events','事件']);}
  return t.concat([['raw','Raw']]);
}
function paneBody(r,side,tab){
  let pre='';
  if(side==='res'){
    if(r.st==='failed')return `<div class="note bad">没有收到响应：${esc(r.err)}</div>`;
    if(r.st==='pending')pre=`<div class="note plain">仍在接收，已收到 ${r.events?r.events.length:0} 个事件。</div>`;
    if(r.trunc)pre+=`<div class="note">正文过大，只保留了前 ${r.trunc.kept}（共 ${r.trunc.total}）。实际转发不受影响。</div>`;
  }
  const heads=side==='req'?reqH(r):resH(r);
  const start=side==='req'?`${r.m} ${r.path}${r.query?'?'+r.query:''} HTTP/1.1`:typeof r.st==='number'?`HTTP/1.1 ${r.st} ${STATUS_TEXT[r.st]||''}`:'HTTP/1.1 200 OK';
  if(tab==='header')return pre+kv(heads);
  if(tab==='query')return kv([...new URLSearchParams(r.query)]);
  if(tab==='body')return pre+`<pre class="body">${side==='req'?hl(r.req):r.res?hl(r.res):esc(r.text)}</pre>`;
  if(tab==='events')return pre+`<ol class="events">${r.events.map(([e,d],i)=>`<li><span class="ix">${i+1}</span><span class="ev">${e}</span><span class="d" title="${esc(d)}">${esc(d)}</span></li>`).join('')}</ol>`;
  const body=side==='req'?(r.req?JSON.stringify(r.req):''):r.events?r.events.map(([e,d])=>`event: ${e}\ndata: ${d}\n`).join('\n'):r.res?JSON.stringify(r.res):r.text||'';
  return pre+`<pre class="body">${esc(start+'\n'+heads.map(h=>h.join(': ')).join('\n')+'\n\n'+body)}</pre>`;
}
function drawInsp(){
  const r=R.find(x=>x.id===S.sel),box=$('#insp');
  if(!r){box.innerHTML='';box.className='';return;}
  box.className='insp';
  const sum=`<div class="sum"><span class="m">${r.m}</span><span class="st">${stDot(r)}${stCell(r)}</span><span class="url">${esc(url(r))}</span><span class="meta">${[r.app,r.type,dur(r.ms),r.size].filter(Boolean).join('　')}</span></div>`;
  if(r.st==='tunnel'){
    const host=r.host.replace(/:\d+$/,''),rule=hostRule(host),on=!!rule;
    box.innerHTML=sum+`<div class="tunnel"><h3>这是一条加密隧道</h3>
      <p>aicat 只转发了 ${esc(r.host)} 的加密数据，没有解密内容。</p>
      ${on?`<div class="note plain">${esc(host)} ${rule===host?'已在解密域名里':'匹配解密域名 '+esc(rule)}。这条隧道建立得更早，保持未解密；新连接会被解密。</div>`
          :`<p>解密后可以看到这个域名的请求和响应。只对之后新建的连接生效。</p><button type="button" class="btn primary" data-act="decrypt" data-v="${esc(host)}">解密此域名</button>`}
      ${kv(reqH(r))}</div>`;
    return;
  }
  const pane=(side,name)=>{
    const tabs=tabsOf(r,side),want=S[side+'Tab'],cur=tabs.some(t=>t[0]===want)?want:'header';
    return `<section class="pane" aria-label="${name}"><div class="pane-head"><h3>${name}</h3>
      <div class="ptabs" role="tablist" aria-label="${name}视图">${tabs.map(([v,t])=>`<button type="button" role="tab" aria-selected="${v===cur}" tabindex="${v===cur?0:-1}" data-act="ptab" data-side="${side}" data-v="${v}">${t}</button>`).join('')}</div>
      <button type="button" class="icon-btn" data-act="copy-pane" data-side="${side}" aria-label="复制${name}的当前视图">${icon('copy')}</button></div>
      <div class="pane-body" id="pb-${side}" role="tabpanel" tabindex="0">${paneBody(r,side,cur)}</div></section>`;
  };
  box.innerHTML=sum+`<div class="panes">${pane('req','请求')}${pane('res','响应')}</div>`;
}
function curl(r){
  return `curl '${url(r)}' -X ${r.m}`+reqH(r).filter(h=>h[0]!=='Host'&&h[0]!=='Content-Length').map(h=>` \\\n  -H '${h[0]}: ${h[1]}'`).join('')+(r.req?` \\\n  --data '${JSON.stringify(r.req).replace(/'/g,"'\\''")}'`:'');
}
function togglePin(h){
  const i=S.pinned.indexOf(h);
  if(i<0){S.pinned.push(h);toast('已固定 '+h);}else{S.pinned.splice(i,1);toast('已取消固定 '+h);}
  drawSide();
}

    <h1>代理</h1><p class="lede">只有明确配置了代理的客户端，流量才会经过 aicat。</p>
    <div class="rows">
      <div class="row"><div><h2>监听地址</h2><p>代理、API 和 MCP 共用这个地址。API 和 MCP 始终只接受本机请求。</p></div>
        <div class="ctl"><select class="field" id="host" aria-label="监听 IP">${['127.0.0.1','0.0.0.0','192.168.1.23'].map(h=>`<option ${h===S.host?'selected':''}>${h}</option>`).join('')}</select>
        <input class="field num" id="port" aria-label="端口" inputmode="numeric" value="${esc(S.port)}" style="width:72px"><button type="button" class="btn" data-act="apply-listen">应用</button></div></div>
      <div class="row"><div><h2>根证书</h2><p>解密 HTTPS 需要系统信任 aicat 的根证书。私钥只保存在这台 Mac 上。</p></div>
        <div class="ctl">${trusted?'<span class="state ok">已信任</span>':S.cert==='auth'?'<span class="waiting" role="status"><i class="spin"></i>等待 macOS 授权…</span>':'<button type="button" class="btn primary" data-act="cert-install">安装证书</button>'}</div>
        ${trusted?`<div class="wide"><dl class="cert"><dt>名称</dt><dd>aicat</dd><dt>有效期</dt><dd class="num">2026-11-09 至 2036-11-06</dd><dt>SHA-256</dt><dd><code>7C:1E:9A:42:D0:5B:38:F1:6A:0C:E4:93:2B:77:A8:15:4D:F2:61:B9:0E:C3:58:AD:26:9F:B4:70:13:E8:5C:D7</code></dd></dl></div>
        <div class="wide"><button type="button" class="btn" data-act="say" data-v="已导出 aicat-root-ca.pem（演示）">导出公开证书</button><button type="button" class="btn" data-act="say" data-v="已打开钥匙串访问（演示）">打开钥匙串</button><button type="button" class="btn danger" data-act="cert-delete">删除证书</button></div>`:''}</div>
      <div class="row"><div><h2 id="spw">系统代理</h2><p>开启后，这台 Mac 上遵循系统代理的应用都会经过 aicat。退出 aicat 时恢复原来的设置。${trusted?'':'需要先安装并信任根证书。'}</p></div>
        <div class="ctl"><span>${S.sysProxy?'已接管':'未接管'}</span><button type="button" class="switch" role="switch" aria-checked="${S.sysProxy}" aria-labelledby="spw" data-act="sysproxy" ${trusted?'':'disabled'}></button></div></div>
      <div class="row"><div><h2>解密域名</h2><p>只解密列出的域名，其余 HTTPS 保持直通。可以用 <code>*.example.com</code> 匹配它的所有子域名，不含 example.com 本身。改动只对新建的连接生效。</p></div>
        <div class="wide"><input class="field" id="newhost" aria-label="要解密的域名" placeholder="例如 api.example.com 或 *.example.com" style="flex:1;min-width:160px" autocomplete="off" spellcheck="false"><button type="button" class="btn" data-act="host-add">添加域名</button></div>
        <ul class="hosts" style="grid-column:1/-1">${S.hosts.map(h=>`<li><code>${esc(h)}</code><button type="button" class="icon-btn" data-act="host-del" data-v="${esc(h)}" aria-label="移除 ${esc(h)}">${icon('x')}</button></li>`).join('')}</ul></div>
    </div>`}
  </div></section></div>`;
}

/* ---------- 交互 ---------- */
const go=(p)=>{S.page=p;S.connect=false;draw();};
function openMore(){
  const b=$('#rail [data-act="more"]'),r=b.getBoundingClientRect(),mods=[S.trafficOn&&'traffic'].filter(Boolean);
  $('#menu').innerHTML=`<div class="pop" role="dialog" aria-label="更多模块" style="left:${r.right+8}px;top:${r.top}px"><h2>模块</h2>${mods.length?mods.map(p=>{
    const on=S.navPins.includes(p),tip=on?'取消固定':'固定到导航栏';
    return `<div class="pop-row"><button type="button" class="open" data-act="go" data-v="${p}">${icon(MODS[p][1])}${MODS[p][0]}</button><button type="button" class="icon-btn" data-act="pin-nav" data-v="${p}" aria-pressed="${on}" aria-label="${tip}" title="${tip}">${icon('pin')}</button></div>`;
  }).join('')+'<p>固定的显示在导航栏，不常用的取消固定后收在这里。</p>':'<p>还没有可以收在这里的模块，可以在扩展里启用。</p>'}</div>`;
  b.setAttribute('aria-expanded','true');
  const f=$('#menu .pop button');f&&f.focus();
}
const ACT={
  go:t=>go(t.dataset.v),
  hist:t=>{const d=+t.dataset.v;let to=H.at+d;
    while(H.list[to]&&!S.trafficOn&&JSON.parse(H.list[to]).page==='traffic')to+=d;
    if(!H.list[to])return;
    H.at=to;Object.assign(S,JSON.parse(H.list[to]));draw();},
  more:(t,wasOpen)=>{if(!wasOpen)openMore();},
  'pin-nav':t=>{const p=t.dataset.v,i=S.navPins.indexOf(p);
    if(i<0)S.navPins.push(p);else S.navPins.splice(i,1);
    drawBar();openMore();const el=$('#menu .pop [data-act="pin-nav"]');el&&el.focus();},
  'go-ext':()=>{S.ext='traffic';go('ext');},
  'go-proxy':()=>{S.set='proxy';go('settings');},
  demo:t=>{S.connected=t.dataset.v==='connected';S.waiting=false;S.drawn=false;go('overview');},
  theme:()=>{S.themePref=document.documentElement.dataset.theme==='dark'?'light':'dark';draw();},
  'theme-pref':t=>{S.themePref=t.dataset.v;draw();},
  lang:t=>{S.lang=t.dataset.v;draw();toast('这份设计稿只做了简体中文');},
  copy:t=>copy(t.dataset.text),
  'copy-proxy':()=>copy(base(),'代理地址 '+base()),
  'toast-do':()=>{const f=toastFn;$('#toast').innerHTML='';f&&f();},
  say:t=>toast(t.dataset.v),
  connect:()=>{S.page='overview';S.connect='agent';draw();},
  'connect-prov':()=>{S.page='overview';S.connect='provider';draw();},
  range:t=>{S.range=t.dataset.v;draw();},
  metric:t=>{S.metric=t.dataset.v;draw();},
  dim:t=>{S.dim=t.dataset.v;draw();},
  prov:t=>{S.prov=t.dataset.v;draw();},
  'prov-save':()=>{if(!$('#prov-url').value.trim()||!$('#prov-key').value.trim()){toast('接口地址和 API Key 都要填');return;}
    S.provSaved.add(S.prov);draw();toast('已保存 '+PROVS[S.prov].name+' 的密钥（演示）');},
  'see-fail':()=>{S.filter=null;S.q='';S.quick='all';S.sel=2234;go('traffic');},
  back:()=>{S.connect=false;draw();},
  client:t=>{S.client=t.dataset.v;draw();},
  'copy-snippet':()=>{copy($('#snippet').textContent,'配置');if(S.connect==='agent'&&!S.connected){S.waiting=true;draw();}},
  sim:()=>{S.connected=true;S.waiting=false;S.connect=false;S.drawn=false;draw();toast('已连接 '+CLIENTS[S.client].name);},
  restart:()=>{S.restart=false;draw();toast('已重启 aicat，新规则已生效');},
  quick:t=>{S.quick=t.dataset.v;draw();},
  pause:()=>{S.paused=!S.paused;draw();},
  clear:()=>{if(!R.length)return;const keep=R,sel=S.sel,n=R.length;R=[];S.sel=null;S.filter=null;S.q='';S.quick='all';draw();
    toast(`已清空 ${n} 个请求`,'撤销',()=>{R=keep;S.sel=sel;draw();});},
  reset:()=>{S.filter=null;S.q='';S.sq='';S.quick='all';draw();},
  export:()=>toast('已导出 aicat-traffic.json（演示）'),
  filter:t=>{S.filter=JSON.parse(t.dataset.v);track();drawBar();drawSide();drawList();drawInsp();const el=document.querySelector('#tside [aria-current="true"]');el&&el.focus();},
  twist:t=>{const id=t.dataset.v;S.open.has(id)?S.open.delete(id):S.open.add(id);drawSide();const el=[...document.querySelectorAll('#tside .twist')].find(b=>b.dataset.v===id);el&&el.focus();},
  ptab:t=>{S[t.dataset.side+'Tab']=t.dataset.v;drawInsp();const el=document.querySelector(`.ptabs [data-side="${t.dataset.side}"][aria-selected="true"]`);el&&el.focus();},
  'copy-pane':t=>copy($('#pb-'+t.dataset.side).innerText,t.dataset.side==='req'?'请求':'响应'),
  decrypt:t=>{S.hosts.push(t.dataset.v);drawInsp();toast(`已开始解密 ${t.dataset.v}，新连接生效`);},
  ext:t=>{S.ext=t.dataset.v;draw();},
  'traffic-toggle':()=>{S.trafficOn=!S.trafficOn;draw();toast(S.trafficOn?'已启用流量':'已停用流量');},
  xtab:t=>{S.xtab=t.dataset.v;draw();},
  'ext-menu':t=>{const r=t.getBoundingClientRect();
    openMenu(r.left,r.bottom+4,[['打开流量',()=>go('traffic'),!S.trafficOn],['代理设置',()=>ACT['go-proxy']()],['复制扩展标识符',()=>copy(S.ext,'扩展标识符')]]);},
  xsec:t=>{const id=t.dataset.v;S.xopen[id]=!S.xopen[id];drawExtSide();const el=$(`#xside [data-act="xsec"][data-v="${id}"]`);el&&el.focus();},
  set:t=>{S.set=t.dataset.v;draw();},
  'apply-listen':()=>{const p=$('#port').value.trim();if(!/^\d{1,5}$/.test(p)||+p<1||+p>65535){toast('端口需要是 1 到 65535 之间的数字');$('#port').focus();return;}
    S.host=$('#host').value;S.port=p;draw();toast(`已切换到 ${S.host}:${S.port}`);},
  'cert-install':()=>{S.cert='auth';draw();setTimeout(()=>{if(S.cert==='auth'){S.cert='trusted';if(S.page==='settings')draw();toast('证书已安装并被系统信任');}},1400);},
  'cert-delete':()=>{S.cert='none';S.sysProxy=false;draw();toast('已删除证书，HTTPS 恢复直通');},
  sysproxy:()=>{S.sysProxy=!S.sysProxy;draw();toast(S.sysProxy?'系统代理已接管':'已恢复原来的系统代理设置');},
  'host-add':()=>{const el=$('#newhost'),h=el.value.trim().toLowerCase();
    if(!/^(\*\.)?[a-z0-9-]+(\.[a-z0-9-]+)*$/.test(h)){toast(h.includes('*')?'通配符只能写在最前面，例如 *.example.com':'请输入一个域名或 IP，不带协议和路径');el.focus();return;}
    if(S.hosts.includes(h)){toast(h+' 已在列表里');return;}
    S.hosts.push(h);draw();$('#newhost').focus();toast('已添加 '+h);},
  'host-del':t=>{const h=t.dataset.v,i=S.hosts.indexOf(h);S.hosts.splice(i,1);draw();toast('已移除 '+h,'撤销',()=>{S.hosts.splice(i,0,h);draw();});}
};
function select(id,focus){S.sel=id;drawList(focus);drawInsp();}
function closeMenu(){$('#menu').innerHTML='';const b=$('#rail [data-act="more"]');b&&b.setAttribute('aria-expanded','false');}
function openMenu(x,y,items){
  $('#menu').innerHTML=`<div class="menu" role="menu" style="left:${Math.min(x,innerWidth-190)}px;top:${Math.min(y,innerHeight-items.length*30-16)}px">${items.map((it,i)=>`<button type="button" role="menuitem" data-i="${i}" ${it[2]?'disabled':''}>${it[0]}</button>`).join('')}</div>`;
  const m=$('#menu .menu');m.items=items;
  const first=m.querySelector('button:not(:disabled)');first&&first.focus();
}
document.addEventListener('click',e=>{
  const mi=e.target.closest('.menu button');
  if(mi){const f=$('#menu .menu').items[+mi.dataset.i][1];closeMenu();f();return;}
  const wasPop=!!$('#menu .pop');
  closeMenu();
  const t=e.target.closest('[data-act]');
  if(t){if(!t.disabled)ACT[t.dataset.act](t,wasPop);return;}
  const row=e.target.closest('#list tr[data-id]');
  if(row)select(+row.dataset.id,true);
});
document.addEventListener('contextmenu',e=>{
  const row=e.target.closest('#list tr[data-id]'),dom=e.target.closest('[data-host]');
  if(!row&&!dom)return;
  e.preventDefault();
  const rect=(row||dom).getBoundingClientRect(),x=e.clientX||rect.left+24,y=e.clientY||rect.bottom;
  if(row){
    const r=R.find(v=>v.id===+row.dataset.id),h=r.host,full=r.m!=='CONNECT'&&typeof r.st==='number'&&!r.trunc;
    select(r.id,false);
    openMenu(x,y,[['复制 URL',()=>copy(url(r),' URL')],['复制 cURL',()=>copy(curl(r),' cURL'),!full],[S.pinned.includes(h)?'取消固定域名':'固定域名',()=>togglePin(h)]]);
  }else{
    const h=dom.dataset.host;
    openMenu(x,y,[[S.pinned.includes(h)?'取消固定':'固定',()=>togglePin(h)]]);
  }
});
document.addEventListener('mouseover',e=>{const c=e.target.closest('.col'),t=$('#tip');if(c)tipShow(c);else if(t)t.hidden=true;});
document.addEventListener('focusin',e=>{const c=e.target.closest('.col'),t=$('#tip');if(c)tipShow(c);else if(t)t.hidden=true;});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;
  if(k==='q'){S.q=e.target.value;drawList();drawInsp();}
  if(k==='xq'){S.xq=e.target.value;const pos=e.target.selectionStart;drawExtSide();const el=$('#xside input');el.focus();el.setSelectionRange(pos,pos);}
  if(k==='sq'){S.sq=e.target.value;const pos=e.target.selectionStart;drawSide();const el=$('#tside input');el.focus();el.setSelectionRange(pos,pos);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#menu .pop')){e.preventDefault();closeMenu();const b=$('#rail [data-act="more"]');b&&b.focus();return;}
  const menu=$('#menu .menu');
  if(menu){
    const bs=[...menu.querySelectorAll('button:not(:disabled)')],i=bs.indexOf(document.activeElement);
    if(e.key==='Escape'){closeMenu();e.preventDefault();}
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus();}
    else if(e.key==='Tab')closeMenu();
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&S.page==='traffic'){e.preventDefault();$('#q').focus();$('#q').select();return;}
  if(e.target.id==='newhost'&&e.key==='Enter'){ACT['host-add']();return;}
  if(e.target.id==='port'&&e.key==='Enter'){ACT['apply-listen']();return;}
  const col=e.target.closest('.col');
  if(col&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const n=e.key==='ArrowRight'?col.nextElementSibling:col.previousElementSibling;if(n){e.preventDefault();n.focus();}return;}
  const tab=e.target.closest('.ptabs button,.seg [role="radio"]');
  if(tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    const all=[...tab.parentElement.children],n=all[(all.indexOf(tab)+(e.key==='ArrowRight'?1:-1)+all.length)%all.length];
    e.preventDefault();n.focus();n.click();return;
  }
  const row=e.target.closest('#list tr[data-id]');
  if(S.page==='traffic'&&e.key==='Escape'&&S.sel!=null&&!e.target.closest('input')){select(null,!!row);return;}
  if(!row)return;
  const rows=visible(),i=rows.findIndex(r=>r.id===+row.dataset.id);
  const to={ArrowDown:Math.min(i+1,rows.length-1),ArrowUp:Math.max(i-1,0),Home:0,End:rows.length-1}[e.key];
  if(to!=null){e.preventDefault();select(rows[to].id,true);}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();select(rows[i].id,true);}
});
// 截图入口：aicat-redesign.html#page=traffic&theme=dark&state=first&set=proxy&sel=2234&reqTab=body&resTab=events&connect=1
const init=Object.assign({},window.AICAT_PREVIEW,Object.fromEntries(new URLSearchParams(location.hash.slice(1))));
if(init.page)S.page=init.page;
if(init.theme)S.themePref=init.theme;
if(init.state==='first')S.connected=false;
if(init.set)S.set=init.set;
if(init.sel!=null)S.sel=init.sel===''?null:+init.sel;
if(init.reqTab)S.reqTab=init.reqTab;
if(init.resTab)S.resTab=init.resTab;
if(init.xtab)S.xtab=init.xtab;
if(init.connect)S.connect=init.connect==='provider'?'provider':'agent';
for(const k of ['range','metric','dim'])if(init[k])S[k]=init[k];
draw();
})();
</script>
